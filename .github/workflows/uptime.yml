# 桌機以外的外部監控（TODO「桌機以外的外部監控」，2026-11-09）
#
# watchdog 跑在桌機上：停電、整台當機、斷網時它也跟著停，沒人知道網站掛了。
# 這個 workflow 跑在 GitHub 的雲端機器（ubuntu-latest，不是桌機的 self-hosted runner），每 10 分鐘從外面打一次網站。
#
# 通知方式（不需要任何 secret 就能用）：
#   - 連不到 → 開一個標籤 uptime 的 issue「🔴 網站連不到」，GitHub 會寄信通知 repo 擁有者
#   - 恢復 → 在 issue 留言「✅ 恢復」並關掉
#   - 只在狀態改變時通知，掛著的期間不會每 10 分鐘一封
#   - 有設 repo secret ALERT_SMTP_USER／ALERT_SMTP_PASS（跟 .env.local 同一組 Gmail 應用程式密碼）的話，
#     同時寄一封到 otemon（系統通知信箱）
#
# UA 帶 kbs0830-uptime：scripts/lib/raw-traffic.js 不把它算進流量統計。
# GitHub 的排程不保證準時（尖峰可能晚幾分鐘到十幾分鐘），這是「桌機整個掛掉」的最後防線，不是秒級監控。
name: Uptime (external)

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # secret 不能直接寫在 if 裡，放 job 層 env 再判斷有沒有設
    env:
      SMTP_USER: ${{ secrets.ALERT_SMTP_USER }}
      SMTP_PASS: ${{ secrets.ALERT_SMTP_PASS }}
    steps:
      - name: Check https://kbs0830.com/
        id: probe
        run: |
          # 首頁要 200、內容要有網站名稱（Cloudflare 的錯誤頁也可能回 200 以外的碼，但保險起見也看內容）
          # 間隔 20 秒試 3 次，偶發的網路抖動不算掛
          for i in 1 2 3; do
            code=$(curl -s -o page.html -w "%{http_code}" -m 20 -A "kbs0830-uptime (+https://github.com/kbs0830/kbs0830_web)" https://kbs0830.com/ || echo 000)
            if [ "$code" = "200" ] && grep -q "PINGWEI LI" page.html; then
              echo "up=true" >> "$GITHUB_OUTPUT"; echo "OK ($code)"; exit 0
            fi
            echo "try $i: HTTP $code"; sleep 20
          done
          echo "up=false" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Open or close the uptime issue
        id: issue
        uses: actions/github-script@v7
        env:
          UP: ${{ steps.probe.outputs.up }}
          CODE: ${{ steps.probe.outputs.code }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const open = (await github.rest.issues.listForRepo({ owner, repo, state: "open", labels: "uptime", per_page: 1 })).data[0];
            const now = new Date().toLocaleString("zh-TW", { timeZone: "Asia/Taipei", hour12: false });
            if (process.env.UP === "true") {
              if (open) {
                await github.rest.issues.createComment({ owner, repo, issue_number: open.number, body: `✅ ${now} 恢復，外部連得到了。` });
                await github.rest.issues.update({ owner, repo, issue_number: open.number, state: "closed" });
                core.setOutput("changed", "recovered");
              }
              return;
            }
            if (open) return; // 已經開過了，不重複通知
            // 第一次掛的時候標籤可能還不存在
            await github.rest.issues.createLabel({ owner, repo, name: "uptime", color: "d73a4a", description: "外部監控：網站連不到" }).catch(() => {});
            await github.rest.issues.create({
              owner, repo,
              title: "🔴 網站連不到（外部監控）",
              labels: ["uptime"],
              body: [
                `${now}（台灣時間）從 GitHub 雲端打 https://kbs0830.com/ 連續 3 次失敗（最後一次 HTTP ${process.env.CODE || "?"}）。`,
                "",
                "可能原因：桌機停電／當機／斷網、Cloudflare Tunnel 斷線、Next.js 掛掉且 watchdog 沒救回來。",
                "- 530／1033：Tunnel 斷線（桌機上的 cloudflared）",
                "- 502：Tunnel 在、但 Next.js 沒回應",
                "- 000：DNS 或 Cloudflare 本身",
                "",
                "恢復時這個 issue 會自動關掉。",
              ].join("\n"),
            });
            core.setOutput("changed", "down");

      - name: Email otemon (optional)
        if: steps.issue.outputs.changed != '' && env.SMTP_USER != ''
        env:
          CHANGED: ${{ steps.issue.outputs.changed }}
        run: |
          if [ "$CHANGED" = "down" ]; then subj="🔴 網站連不到（GitHub 外部監控）"; else subj="✅ 網站已恢復（GitHub 外部監控）"; fi
          printf 'From: %s\r\nTo: %s\r\nSubject: =?UTF-8?B?%s?=\r\nContent-Type: text/plain; charset=UTF-8\r\n\r\n%s\r\nhttps://github.com/%s/issues?q=label%%3Auptime\r\n' \
            "$SMTP_USER" "$SMTP_USER" "$(printf '[kbs0830] %s' "$subj" | base64 -w0)" "$subj" "$GITHUB_REPOSITORY" > mail.txt
          curl -s --url "smtps://smtp.gmail.com:465" --ssl-reqd --mail-from "$SMTP_USER" --mail-rcpt "$SMTP_USER" \
            --user "$SMTP_USER:$SMTP_PASS" --upload-file mail.txt && echo "sent"
